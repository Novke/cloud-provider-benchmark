name: Deploy to Hetzner VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      compute_iterations:
        description: 'COMPUTE_ITERATIONS env var'
        required: false
        default: '100000'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner VPS
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          COMPUTE_ITERATIONS: ${{ github.event.inputs.compute_iterations }}
        run: |
          ssh -i ~/.ssh/deploy_key $HETZNER_USER@$HETZNER_HOST << 'ENDSSH'
            set -e

            # Navigate to project directory
            cd /srv/backend/cloud-benchmark

            # Pull latest code (or clone if first time)
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # Create .env file
            cat > .env << EOF
          COMPUTE_ITERATIONS=${{ github.event.inputs.compute_iterations }}
          STORAGE_BACKEND_NATIVE=mock
          STORAGE_BACKEND_NEUTRAL=mock
          EOF

            # Build and restart containers
            sudo docker-compose down || true
            sudo docker-compose build
            sudo docker-compose up -d

            # Wait for health check
            sleep 5

            # Verify deployment
            curl -f http://localhost:8000/health || echo "Health check failed"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
