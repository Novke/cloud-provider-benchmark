# Example orchestrator config. Kopiraj u scripts/orchestrate.config.yaml i prilagodi URL-ove
# stvarnim endpoint-ima iz k6/env/*.bat (vrednosti su lokalne i ne idu u git).
#
# Korisni override-i preko CLI:
#   python scripts/orchestrate.py --config scripts/orchestrate.config.yaml \
#                                  --session-id morning --iterations 10 --warmup 1
#
# Za 24-72h stratified time-slot benchmark, pokrece se 3 puta dnevno preko systemd
# timer-a (vidi deploy/systemd/) sa session-id-ovima: morning / afternoon / night.

iterations: 10
warmup_runs: 1
inter_run_sleep_sec: 5
# Health-check (pre-run liveness za NE-cold-start scenarije; cold-start ga preskace).
# 60s + 3 retry-a: FaaS cold start (npr. GCP CF Gen2 ASGI bootstrap ~10s, povremeno
# i duze) ume da probije 30s na prvom NE-cold-start scenariju posle scale-to-zero gap-a.
health_check_timeout_sec: 60
health_check_retries: 3

targets:
